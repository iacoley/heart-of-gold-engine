name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs (base = another PR's branch) get CI too.
  pull_request:

# One run per PR; a new push cancels the in-flight run. Pushes to main are
# keyed by SHA so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast checks — runs in seconds, catches syntax and structure issues
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Check Python syntax (all scripts)
        run: |
          find bin/ system/ mcp/ -name '*.py' -exec python -m py_compile {} +

      - name: Check shell syntax (all scripts)
        run: |
          find . -name '*.sh' -not -path './.git/*' -exec bash -n {} +

      - name: Check Next.js route exports
        run: pytest tests/test_dashboard_sanity.py::TestNextjsRouteExports -v

      - name: Validate file structure
        run: pytest tests/test_repo_structure.py -v

      - name: Validate env template and script syntax
        run: pytest tests/test_env_template.py tests/test_script_syntax.py -v

  # Unit tests — tests core logic. Docker build/compose CI jobs (docker-smoke,
  # compose-check) and the standalone preflight job were removed 2026-08-18 —
  # this repo has run native systemd since 2026-08-11 (native-migration-
  # complete-2026-08-11 in memory) and nothing here builds or runs the
  # Dockerfile/docker-compose.yml anymore; see tests/test_native_start.py for
  # the native bootstrap's own coverage, and tests/test_preflight.py (trimmed,
  # Docker-specific checks removed) still runs as part of the suite below.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v -m "not slow" --tb=short
